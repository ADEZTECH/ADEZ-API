<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADEZ Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@500;700;800;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="theme-dark">
    <header class="site-header compact-header">
      <nav class="nav container">
        <div class="brand-wrap">
          <div class="brand-mark">A</div>
          <div class="brand-copy">
            <div class="brand-name">ADEZ<span>API</span></div>
            <div class="brand-tag">Powered by ADEZ TECH</div>
          </div>
        </div>

        <div class="nav-links">
          <a href="/">Home</a>
          <a href="/dashboard">Dashboard</a>
          <a href="/contact">Contact</a>
        </div>

        <a href="/" class="btn btn-primary">Back Home</a>
      </nav>
    </header>

    <main class="login-page container">
      <section class="auth-card">
        <div class="auth-copy">
          <p class="eyebrow">Welcome back</p>
          <h1>Access your control center</h1>
          <p>
            Sign in to manage your API access, monitor systems, and build smarter digital experiences.
          </p>
        </div>

        <form class="login-form">
          <label>
            Email Address
            <input type="email" placeholder="you@company.com" />
          </label>

          <label>
            Password
            <input type="password" placeholder="Enter your password" />
          </label>

          <div class="form-row">
            <label class="remember-me"><input type="checkbox" /> Remember me</label>
            <a href="#">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary full-width">Sign In</button>

          <div class="divider"><span>or</span></div>

          <button type="button" class="btn btn-outline full-width">Continue with WhatsApp</button>
        </form>
      </section>
    </main>
  </body>
</html>
